<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semua Destinasi | Bintang Jaya Lancar</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />
    <style>
        .grid_destinasi { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; padding: 40px; max-width: 1240px; margin: 100px auto auto; }
        .destinasi_card_full { position: relative; width: 100%; height: 350px; border-radius: 10px; overflow: hidden; background: #EAEAEA; display: flex; flex-direction: column; }
        .destinasi_card_full img { width: 100%; height: 200px; object-fit: cover; }
        .destinasi_info { padding: 15px; display: flex; flex-direction: column; flex-grow: 1; justify-content: space-between; }
        .destinasi_info h3 { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 18px; color: #000; }
        .btn_detail_destinasi { width: 100%; padding: 10px; background: #8C0000; color: #fff; font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 600; border-radius: 8px; cursor: pointer; text-align: center; }
    </style>
</head>
<body>
    <header class="header scrolled"><div class="nav container"><a href="../index.html" class="logo_title" style="color:black;">Kembali ke Beranda</a></div></header>
    
    <div class="grid_destinasi" id="allDestinasiContainer">
        <!-- Akan diisi oleh JavaScript -->
    </div>

    <script>
        const API_BASE_URL = '/api';
        
        async function loadAllDestinasi() {
            try {
                const res = await fetch(`${API_BASE_URL}/destinasi`);
                const destinasiList = await res.json();
                const container = document.getElementById('allDestinasiContainer');
                
                container.innerHTML = destinasiList.map(item => `
                    <div class="destinasi_card_full">
                        <img src="${item.image_url}" alt="${item.name}">
                        <div class="destinasi_info">
                            <h3>${item.name}</h3>
                            <a href="detail-destinasi.html?id=${item.id}" class="btn_detail_destinasi">Lihat Detail Destinasi</a>
                        </div>
                    </div>
                `).join('');
            } catch (err) {
                console.error(err);
            }
        }
        loadAllDestinasi();
    </script>
</body>
</html>
